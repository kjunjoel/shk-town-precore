# ==============================================================================
#                      SHK TOWN 시스템 메인 설정 파일
# ==============================================================================

# ------------------------------------------------------------------------------
# 전역 설정
# ------------------------------------------------------------------------------
global:
  # 모든 시스템 안내 메시지 맨 앞에 붙는 접두사
  prefix: "§b[SHK TOWN] "

  # 리로드 명령어 실행 성공 시 출력되는 메시지
  reload_success: "§f설정 파일(config.yml)이 성공적으로 리로드되었습니다!"

  # 명령어 실행 권한이 없을 때 출력되는 경고 메시지
  no_permission: "§c당신은 이 명령어를 사용할 권한이 없습니다."

# ------------------------------------------------------------------------------
# 스마트폰 관련 설정
# ------------------------------------------------------------------------------
smartphone:
  # 스마트폰 GUI 타이틀
  title: "\uE001"

  # 스마트폰 메인 화면에 배치될 앱 아이템 설정
  # slot    : GUI 내부 배치 슬롯 번호 (0 ~ 53)
  # material: 마인크래프트 아이템 ID
  # name    : 아이템 표시 이름
  # lore    : 아이템 설명 문구 (리스트 형태)
  items:
    bank:
      slot: 20
      material: "GOLD_INGOT"
      name: "§e§l상어은행"
      lore:
        - "§7상대방 계좌번호로 간편하게"
        - "§7송금하거나 주 또는 도시 세금 현황을 조회합니다."
    town:
      slot: 21
      material: "IRON_DOOR"
      name: "§b§l도시 관리"
      lore:
        - "§7우리 주 또는 도시의 땅을 관리하고"
        - "§7국민 또는 시민 명부 및 공동 금고를 제어합니다."
    investment:
      slot: 22
      material: "EMERALD"
      name: "§a§lSHK Investment"
      lore:
        - "§7실시간으로 변동하는 주식과"
        - "§7가상자산 시세를 확인하고 매매합니다."
    market:
      slot: 29
      material: "ORANGE_DYE"
      name: "§6§l상어마켓"
      lore:
        - "§7유저들이 올린 물품을"
        - "§7비대면으로 구매하거나 내 템을 판매합니다."
    taxi:
      slot: 30
      material: "YELLOW_DYE"
      name: "§e§lSHARK T"
      lore:
        - "§7택시를 사용하여"
        - "§7원하는 주요 거점으로 즉시 이동합니다."
    navigation:
      slot: 31
      material: "MAP"
      name: "§9§lSHK 네비게이션"
      lore:
        - "§7바닥에 그려지는 입체 파티클 가이드를"
        - "§7따라 목적지까지 실시간 길 안내를 받습니다."
    talk:
      slot: 38
      material: "WRITABLE_BOOK"
      name: "§f§l샤크톡"
      lore:
        - "§7단체 대화방, 마을 단톡방 및"
        - "§7실시간 계좌 입출금 알림톡을 확인합니다."
    challengers:
      slot: 39
      material: "CLOCK"
      name: "§d§l챌린저스"
      lore:
        - "§7일일 퀘스트 또는 접속시간 챌린지 현황을"
        - "§7확인하고 보상을 획득합니다."
    parcel:
      slot: 40
      material: "CHEST"
      name: "§a§lSHK 택배"
      lore:
        - "§7상어마켓에서 구매한 물품이나"
        - "§7시스템 보상 아이템을 여기서 원격 수령합니다."
    settings:
      slot: 41
      material: "NAME_TAG"
      name: "§5§l설정"
      lore:
        - "§7내 머리 위에 표시될 칭호와"
        - "§7스마트폰 프로필 명함을 커스텀합니다."
    cashshop:
      slot: 42
      material: "DIAMOND"
      name: "§b§l캐시샵"
      lore:
        - "§7보유 중인 캐시를 소모하여"
        - "§7치장용 자산이나 특수 아이템을 결제합니다."

# ------------------------------------------------------------------------------
# 3. 스마트폰 택시 관련 설정
# ------------------------------------------------------------------------------
taxi:
  # 일반 동작 옵션
  settings:
    # 택시 앱 실행 시 기본적으로 보여줄 지도 ID
    default_map: "map_0_0"

    # 유저가 택시 승강장 범위 내에 있을 때만 이동 가능하게 할 지 여부
    require_taxi_stop: true

    # 승강장 인식을 위한 허용 반경 거리 (blocks)
    allowed_radius: 8.0

  # 화면 연출 및 텔레포트 타이머 옵션
  ui:
    # 이동 시 화면 중앙에 뜨는 메인 타이틀 ({stop_name}으로 정류장명 사용 가능)
    title_main: "§e🚕 이동 중..."

    # 이동 시 화면 중앙에 뜨는 서브 타이틀 ({stop_name}으로 정류장명 사용 가능)
    title_sub: "§7목적지: {stop_name}"

    # 타이틀 페이드인 / 유지 / 페이드아웃 시간 (ms)
    title_fade_in_ms: 250
    title_stay_ms: 1250
    title_fade_out_ms: 250

    # 클릭 후 실제 텔레포트까지 대기 시간 (ticks)
    teleport_delay_ticks: 30

  # 시스템 안내 메시지
  messages:
    # 전역 접두사 사용 여부
    use_global_prefix: false

    # 정류장 범위를 벗어난 상태에서 호출 시 경고 메시지
    not_in_stop: "§c[SHARK T] 주변에 택시 정류장이 없어 호출할 수 없습니다!"

    # 목적지 도착 시 출력 메시지
    arrived: "§a[SHARK T] {stop_name} (으)로 도착했습니다!"

    # 앱 오픈 시 출력 메시지
    loading_app: "§e[SHARK T] §a앱을 로딩하는 중..."

  # 택시 승강장 목록
  # name    : 승강장 이름
  # location: 승강장 좌표
  stops:
    spawn:
      name: "중앙광장"
      location:
        world: "world"
        x: 0.5
        y: 64.0
        z: 0.5

    town_center:
      name: "중앙마을"
      location:
        world: "world"
        x: 150.5
        y: 70.0
        z: -300.5

  # 지도 페이지 및 지도 내 택시 정류장 위치
  maps:
    # 지도 ID
    map_0_0:
      # 지도 GUI 타이틀 이름
      title: "\uE002"

      # 화면 좌우 클릭 시 전환될 지도 연결 설정 (east, west 사용 가능)
      navigation:
        east: "map_1_0"

      # 지도 GUI 택시 정류장 별 연결 정류장
      # slot_X  : X번 슬롯에 위치
      # name    : 정류장 이름
      # location: 정류장 좌표
      stops:
        slot_11:
          name: "중앙 광장"
          location:
            world: "world"
            x: 10.5
            y: 64.0
            z: 5.5
            yaw: 90.0
            pitch: 0.0
        slot_15:
          name: "샤카오 중앙 은행"
          location:
            world: "world"
            x: 88.5
            y: 65.0
            z: -42.5
            yaw: 180.0
            pitch: 0.0

    map_1_0:
      title: "\uE002"
      navigation:
        west: "map_0_0"
      stops:
        slot_20:
          name: "동쪽 공업 단지"
          location:
            world: "world"
            x: 350.5
            y: 68.0
            z: -12.0
            yaw: 0.0
            pitch: 0.0