title: "\uE001"

# 모든 스마트폰 앱이 공유하는 기본 조작 아이템입니다.
home_button:
  material: COMPASS
  name: "&cHOME"
  model_name: 0

# 모든 스마트폰 앱의 이전/다음 화면 이동에 공통으로 사용하는 버튼입니다.
navigation_buttons:
  previous_button:
    material: ARROW
    name: "&a◀ 이전 페이지"
    model_name: 0
  next_button:
    material: ARROW
    name: "&a다음 페이지 ▶"
    model_name: 0

# 하단 독에 고정 표시할 앱 ID입니다. HOME 버튼은 가운데에 고정됩니다.
fixed_apps:
  left: settings
  right: talk

# 일반 앱은 order 순서로 한 페이지당 15개씩 자동 배치됩니다.
# slot은 더 이상 사용하지 않습니다.
items:
  bank:
    order: 1
    material: GOLD_INGOT
    name: "&e상어은행"
    model_name: 0
    lore:
      - "&7상대방 계좌번호로 간편하게"
      - "&7송금하거나 주 또는 도시 세금 현황을 조회합니다."
  town:
    order: 2
    material: IRON_DOOR
    name: "&b도시 관리"
    model_name: 0
    lore:
      - "&7우리 주 또는 도시의 땅을 관리하고"
      - "&7국민 또는 시민 명부 및 공동 금고를 제어합니다."
  investment:
